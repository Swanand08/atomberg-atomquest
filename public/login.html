    <script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.querySelector('button[type="button"]');
        const passwordIcon = passwordToggle.querySelector('.material-symbols-outlined');

        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordIcon.innerText = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Auto-fill credentials by role selection
        const roleSelect = document.getElementById('role');
        const emailInput = document.getElementById('email');
        const demoCredentials = {
            employee: { email: 'emp1@company.com', password: 'emp123' },
            manager:  { email: 'manager1@company.com', password: 'mgr123' },
            admin:    { email: 'admin@company.com', password: 'admin123' }
        };

        function autoFillCredentials() {
            const role = roleSelect.value;
            const creds = demoCredentials[role];
            if (creds) {
                emailInput.value = creds.email;
                passwordInput.value = creds.password;
            }
        }

        roleSelect.addEventListener('change', autoFillCredentials);
        // Auto-fill on page load based on default role
        autoFillCredentials();

        // Remember Me - Load saved email
        const rememberCheckbox = document.getElementById('remember');
        const savedEmail = localStorage.getItem('atomquest_email');
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberCheckbox.checked = true;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Handle Remember Me
            if (rememberCheckbox.checked) {
                localStorage.setItem('atomquest_email', email);
            } else {
                localStorage.removeItem('atomquest_email');
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role, email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    if (data.user.role === 'admin') window.location.href = '/admin.html';
                    else if (data.user.role === 'manager') window.location.href = '/manager.html';
                    else window.location.href = '/employee.html';
                } else {
                    alert(data.error || 'Login failed. Please check your credentials.');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('An error occurred during login');
            }
        });

        // Placeholder for Forgot Password and Contact Admin
        document.querySelectorAll('a[href="#"]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const text = e.target.innerText;
                if (text.includes('Forgot Password')) {
                    alert('Please contact HR to reset your password.');
                } else if (text.includes('Contact Admin')) {
                    alert('Contact the IT department at it@atomberg.com for new accounts.');
                } else {
                    alert('This feature will be available in the production release.');
                }
            });
        });
    </script>
</body></html>
